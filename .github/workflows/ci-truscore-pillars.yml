# TruScore pillars + spec E2E (no live Vercel; CI=true skips HTTP in e2eEthicsOpenBackendVerification.ts)
name: CI — Pillars & spec E2E

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

jobs:
  pillars-and-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Unit tests — all four pillars + ethics certifications
        run: npx jest src/__tests__/unit/lib/pillars/ src/__tests__/unit/services/ethicsCertificationsService.test.ts --no-cache

      - name: E2E — Ethics/Open constants & integration (live backend skipped in CI)
        run: npm run test:e2e:ethics-open-backend
        env:
          CI: true
